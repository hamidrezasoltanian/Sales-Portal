name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Node syntax check (frontend modules + server)
        run: |
          set -e
          for f in \
            public/js/core.js \
            public/js/weekplan.js \
            public/js/settings.js \
            server/index.js \
            server/routes/data.js \
            server/routes/week-entries.js \
            server/routes/centers.js \
            tests/behavioral.test.js
          do
            echo "Checking $f"
            node --check "$f"
          done

  integration-tests:
    runs-on: ubuntu-latest
    needs: syntax-check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atena_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atena_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DATABASE: atena_crm_test
      PG_USER: postgres
      PG_PASSWORD: postgres
      JWT_SECRET: ci-test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run behavioral integration tests
        run: npm test
